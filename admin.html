<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벗나루 관리자</title><style>body{font-family:system-ui;margin:0;background:#f3f5f8;color:#172033}.box{max-width:900px;margin:40px auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ccd3dd;border-radius:8px}textarea{min-height:380px;font-family:monospace}button{background:#0c2e63;color:white;border:0;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.note{color:#b42318}h1{margin-top:0}@media(max-width:600px){.box{margin:12px}.row{grid-template-columns:1fr}}</style></head><body><main class="box"><h1>벗나루 관리자</h1><section id="login"><input id="user" placeholder="관리자 아이디"><input id="pass" type="password" placeholder="비밀번호"><button onclick="login()">로그인</button></section><section id="change" class="hidden"><p class="note">최초 로그인입니다. 먼저 비밀번호를 변경하세요.</p><input id="newpass" type="password" placeholder="새 비밀번호 (6자 이상)"><button onclick="changePassword()">비밀번호 변경</button></section><section id="editor" class="hidden"><p>홈페이지의 기본정보, 운영기관, 소식, 사진 목록을 JSON 형식으로 수정할 수 있습니다.</p><textarea id="json"></textarea><div class="row"><button onclick="save()">내용 저장</button><button onclick="logout()">로그아웃</button></div><h2>사진 업로드</h2><input id="photo" type="file" accept="image/*"><button onclick="upload()">사진 업로드</button><p id="result"></p></section><p id="msg" class="note"></p></main><script>const $=id=>document.getElementById(id);async function api(u,o){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const j=await r.json();if(!r.ok)throw Error(j.error||'오류가 발생했습니다.');return j}function show(id){['login','change','editor'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}async function login(){try{let j=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})});j.mustChange?show('change'):load()}catch(e){$('msg').textContent=e.message}}async function changePassword(){try{await api('/api/change-password',{method:'POST',body:JSON.stringify({password:$('newpass').value})});load()}catch(e){$('msg').textContent=e.message}}async function load(){show('editor');$('json').value=JSON.stringify(await api('/api/content'),null,2)}async function save(){try{await api('/api/content',{method:'PUT',body:$('json').value});$('result').textContent='저장했습니다.'}catch(e){$('msg').textContent=e.message}}async function upload(){let f=$('photo').files[0],d=new FormData();d.append('photo',f);let r=await fetch('/api/upload',{method:'POST',body:d}),j=await r.json();$('result').textContent=r.ok?'업로드 완료: '+j.file:j.error}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}api('/api/session').then(s=>s.loggedIn?(s.mustChange?show('change'):load()):show('login'));</script></body></html>
