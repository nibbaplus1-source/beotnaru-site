<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의하기 | 벗나루 청춘태권도</title>
<meta name="description" content="복지관·지자체 프로그램 협력, 수업 참관, 지도자 문의를 받습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="siteHeader"></div>

<main>

<section class="sub">
  <div class="wrap">
    <div class="crumb"><a href="index.html">홈</a> · 문의하기</div>
    <h1>협력 문의</h1>
    <p>진행 중인 수업에 오셔서 직접 보실 수 있습니다. 참관 일정은 전화로 잡아드립니다.</p>
  </div>
</section>

<section class="blk">
  <div class="wrap ccols">
    <div>
      <div class="head" style="margin-bottom:20px"><h2>연락처</h2></div>
      <p class="note" style="color:var(--mute)">전화</p>
      <a class="phone" id="telBig" href="#" style="color:var(--navy)">-</a>
      <p class="note" id="mailLine" style="color:var(--mute)"></p>
      <p class="note" id="orgLine" style="color:var(--mute)"></p>

      <div class="head" style="margin:34px 0 14px"><h2 style="font-size:22px">이런 문의를 받습니다</h2></div>
      <ul class="rows">
        <li><b>복지관·지역 시설</b><span>기관 내 정기 수업 운영 협의</span></li>
        <li><b>지자체 사업</b><span>어르신 건강증진 사업 협력</span></li>
        <li><b>수업 참관</b><span>진행 중인 수업 방문</span></li>
        <li><b>지도자 문의</b><span>함께 수업할 지도자</span></li>
      </ul>
    </div>

    <div>
      <div class="head" style="margin-bottom:20px"><h2>문의 남기기</h2></div>
      <form class="light" onsubmit="sendMail(event)">
        <input id="org" required placeholder="기관명">
        <input id="name" required placeholder="담당자 성함">
        <input id="phone" required placeholder="연락처">
        <input id="email" type="email" required placeholder="이메일">
        <select id="type">
          <option>복지관 프로그램 협력</option>
          <option>지자체 사업 협력</option>
          <option>수업 참관 요청</option>
          <option>함께 수업할 지도자 문의</option>
          <option>그 밖의 문의</option>
        </select>
        <textarea id="message" required placeholder="기관 상황과 희망 일정을 함께 주시면 답변이 빠릅니다."></textarea>
        <button class="send" type="submit">문의 보내기</button>
        <p class="formNote" id="formNote">보내기를 누르면 메일 프로그램이 열립니다.</p>
      </form>
    </div>
  </div>
</section>

</main>

<div id="siteFooter"></div>
<script src="assets/site.js"></script>
<script>
  initPage("contact");
</script>
</body>
</html>
